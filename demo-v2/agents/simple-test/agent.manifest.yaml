name: simple-agent
description: Simple test agent to validate tracing
metadata:
  tags:
    - AI Agent Hosting
template:
  name: simple-agent
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{chat}}"
resources:
  - kind: model
    id: o4-mini
    name: chat

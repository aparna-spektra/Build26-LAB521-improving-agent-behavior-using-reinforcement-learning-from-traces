name: zava-{{MODEL_ID}}
description: >
  Zava RFT agent ({{MODEL_ID}}) with single get_order tool.
  Return policy is embedded in the system prompt for RFT training.
metadata:
  tags:
    - AI Agent Hosting
    - Azure AI AgentServer
    - RFT
template:
  name: zava-{{MODEL_ID}}
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{chat}}"
    - name: TOOL_URL
      value: "{{TOOL_URL}}"
resources:
  - kind: model
    id: {{MODEL_ID}}
    name: chat
